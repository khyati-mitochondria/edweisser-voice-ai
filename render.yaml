# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Secrets (sync: false) are prompted for in the dashboard on first deploy;
# they never live in the repo.
services:
  - type: web
    name: edweisser-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false

  - type: web
    name: edweisser-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set these to the backend's public URL once it's live, then redeploy
      # the frontend (Vite bakes them in at build time). Note wss:// for WS.
      - key: VITE_BACKEND_HTTP_URL
        sync: false
      - key: VITE_BACKEND_WS_URL
        sync: false
